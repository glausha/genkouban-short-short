<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="経営理論と日本の創業制度を題材にしたショートショート『現行版』">
  <title>現行版 — ショートショート</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top">現行版</a>
    <nav aria-label="ページ内ナビゲーション">
      <button class="nav-button active" data-view="story" type="button">作品を読む</button>
      <button class="nav-button" data-view="notes" type="button">解説</button>
    </nav>
  </header>

  <main id="top">
    <section class="hero">
      <p class="eyebrow">SHORT SHORT</p>
      <h1>現行版</h1>
      <p class="lead">会社をつくるのに、人間は何人必要だろう。</p>
      <div class="rule" aria-hidden="true"></div>
    </section>

    <article id="story" class="panel active" aria-live="polite">
      <div class="loading">作品を読み込んでいます……</div>
    </article>

    <article id="notes" class="panel notes" aria-live="polite">
      <div class="loading">解説を読み込んでいます……</div>
    </article>
  </main>

  <footer>
    <p>経営理論、日本の創業実務、AI・ロボット事業を題材にしたフィクションです。</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
